<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>引き継ぎ穴チェッカー | 次の人が困らないメモに</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17243a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:860px;margin:auto;padding:24px 16px 80px}h1{font-size:clamp(1.5rem,4vw,2.2rem);margin-bottom:8px}p{line-height:1.65}textarea,input{font:inherit;width:100%;border:1px solid #b9c4d6;border-radius:10px;padding:12px;background:#fff}textarea{min-height:210px;resize:vertical}label{font-weight:700;display:block;margin:18px 0 8px}button{font:inherit;background:#1255cc;color:white;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;margin:12px 8px 8px 0}button.secondary{background:#e8eef9;color:#163b77}section{background:white;border:1px solid #dfe5ef;border-radius:16px;padding:20px;margin-top:20px}ul{padding-left:24px;line-height:1.8}.warn{color:#a23512}.ok{color:#147047}.small{font-size:.9rem;color:#526176}#output{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fc;border-radius:10px;padding:16px}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #f5a623;outline-offset:2px}</style></head>
<body><main><h1>引き継ぎ穴チェッカー</h1><p>退勤前・担当交代前のメモを、<strong>「誰が・いつまでに・何をするか」</strong>の観点で確認。足りない情報を埋めるための質問と、引き継ぎテンプレートを作ります。</p><p class="small">入力内容はブラウザ内だけで処理します。外部送信・自動保存はしません。機密情報は入力しないでください。</p>
<section><label for="memo">引き継ぎメモ</label><textarea id="memo" placeholder="例：お客様から見積もりの問い合わせ。田中さんに確認中。明日までに回答が必要。"></textarea><button id="check">不足しそうな項目を確認</button><button class="secondary" id="example">例文を入れる</button><div id="results" role="status" aria-live="polite"></div></section>
<section><h2>引き継ぎシートを作る</h2><p class="small">項目を整理して、次の担当者が確認しやすい形式にできます。</p>
<label for="subject">案件・対象</label><input id="subject" placeholder="例：A社への見積もり回答">
<label for="status">現在の状況</label><textarea id="status" style="min-height:85px" placeholder="どこまで終わったか"></textarea>
<label for="owner">次の担当者</label><input id="owner" placeholder="名前・チーム">
<label for="action">次のアクション</label><input id="action" placeholder="具体的に何をするか">
<label for="deadline">期限</label><input id="deadline" type="datetime-local">
<label for="blocker">待ち・障害・未確認事項</label><textarea id="blocker" style="min-height:75px"></textarea>
<label for="reference">参照先・連絡先</label><input id="reference" placeholder="社内の資料名や連絡手段（機密情報に注意）">
<button id="build">シートを生成</button><button class="secondary" id="copy" disabled>結果をコピー</button><div id="output" aria-live="polite">ここにシートが表示されます。</div></section>
<p class="small">注意：これは文章の単純なキーワードチェックです。意味の理解や漏れの完全検出はできません。重要な引き継ぎは人が最終確認してください。</p></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const checks=[
{label:'次の担当者',pattern:/(担当|さん|氏|チーム|部署|引き継|私が|自分が|誰が|owner)/i,question:'次に動く担当者は誰ですか？'},
{label:'期限・次の確認時刻',pattern:/(今日|明日|明後日|今週|来週|まで|期限|時|日|月|deadline|締切)/i,question:'いつまでに対応する必要がありますか？'},
{label:'次にすること',pattern:/(対応|確認|連絡|回答|送信|提出|作成|依頼|折返|折り返|処理|実施|電話|訪問|修正|決定|待ち)/i,question:'次に具体的に何をすればよいですか？'},
{label:'現在の状況',pattern:/(完了|未完|進行|対応中|確認中|済|未対応|保留|待ち|受付|依頼|発生|回答|状態|状況)/i,question:'今どこまで進んでいますか？'},
{label:'参照先・連絡手段',pattern:/(資料|ファイル|リンク|URL|https?:|メール|電話|チャット|連絡先|共有|フォルダ|ドライブ|添付)/i,question:'関連資料や連絡方法は分かりますか？'}
];
$('check').addEventListener('click',()=>{
 const memo=$('memo').value.trim(),target=$('results');target.replaceChildren();
 if(!memo){target.textContent='メモを入力してください。';return;}
 const h=document.createElement('h3');h.textContent='チェック結果';target.append(h);
 const list=document.createElement('ul');let missing=0;
 for(const item of checks){const li=document.createElement('li');const ok=item.pattern.test(memo);li.className=ok?'ok':'warn';li.textContent=(ok?'手がかりあり：':'確認推奨：')+item.label+(ok?'（内容が十分か確認してください）':' — '+item.question);list.append(li);if(!ok)missing++;}
 target.append(list);
 const p=document.createElement('p');p.textContent=missing?missing+'項目に手がかりが見つかりません。下のシートで補いましょう。':'すべての項目に手がかりがあります。ただし内容の十分性は人が確認してください。';target.append(p);
 $('status').value||=memo;
});
$('example').addEventListener('click',()=>{$('memo').value='お客様から見積もりの問い合わせがありました。田中さんに確認中です。明日までに回答が必要です。';$('memo').focus();});
let generated='';
$('build').addEventListener('click',()=>{
 const value=id=>$(id).value.trim()||'【未記入】';
 const date=$('deadline').value?new Date($('deadline').value):null;
 const deadline=date&&!Number.isNaN(date.getTime())?date.toLocaleString('ja-JP'):'【未記入】';
 generated=['【引き継ぎシート】','案件：'+value('subject'),'現状：'+value('status'),'次の担当者：'+value('owner'),'次のアクション：'+value('action'),'期限：'+deadline,'待ち・障害・未確認：'+value('blocker'),'参照先・連絡方法：'+value('reference')].join('\n');
 $('output').textContent=generated;$('copy').disabled=false;
});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(generated);$('copy').textContent='コピーしました';}catch(e){$('copy').textContent='コピー不可：テキストを選択してコピー';}});
</script></body></html>
